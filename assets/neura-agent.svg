<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #0d1117; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .sub { fill: #8b949e; font-size: 11.5px; }
    .head { fill: #e6edf3; font-size: 18px; font-weight: 700; }
    .tag { fill: #a371f7; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    .edge { stroke: #30363d; stroke-width: 2; fill: none; }
    .flow { stroke: url(#g); stroke-width: 2.5; fill: none; stroke-dasharray: 10 14; animation: dash 1.2s linear infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; } .p4 { animation-delay: 3s; }
    .guard { fill: #161b22; stroke: #3fb950; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .gtext { fill: #3fb950; font-size: 11.5px; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { stroke: #30363d; } 12%,25% { stroke: #a371f7; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="900" height="300" rx="14"/>
  <text x="30" y="38" class="tag">NEURA AI · AI/LLM ENGINEERING INTERN</text>
  <text x="30" y="64" class="head">LangGraph customer-support agent</text>

  <!-- edges -->
  <path class="edge" d="M210 140 H240"/><path class="flow" d="M210 140 H240"/>
  <path class="edge" d="M420 140 H450"/><path class="flow" d="M420 140 H450"/>
  <path class="edge" d="M630 140 H660"/><path class="flow" d="M630 140 H660"/>

  <!-- nodes -->
  <rect class="node pulse p1" x="30"  y="100" width="180" height="80" rx="10"/>
  <text x="120" y="133" class="title" text-anchor="middle">Intent</text>
  <text x="120" y="155" class="sub" text-anchor="middle">classification</text>

  <rect class="node pulse p2" x="240" y="100" width="180" height="80" rx="10"/>
  <text x="330" y="133" class="title" text-anchor="middle">Parameter</text>
  <text x="330" y="155" class="sub" text-anchor="middle">extraction</text>

  <rect class="node pulse p3" x="450" y="100" width="180" height="80" rx="10"/>
  <text x="540" y="133" class="title" text-anchor="middle">Tool selection</text>
  <text x="540" y="155" class="sub" text-anchor="middle">5 internal tools</text>

  <rect class="node pulse p4" x="660" y="100" width="210" height="80" rx="10"/>
  <text x="765" y="133" class="title" text-anchor="middle">Response</text>
  <text x="765" y="155" class="sub" text-anchor="middle">generation</text>

  <!-- reliability layer -->
  <rect class="guard" x="30" y="210" width="840" height="56" rx="10"/>
  <text x="450" y="235" class="gtext" text-anchor="middle">RELIABILITY LAYER</text>
  <text x="450" y="254" class="sub" text-anchor="middle">Pydantic-validated tool arguments  ·  retries with exponential backoff  ·  controlled fallbacks</text>
</svg>
